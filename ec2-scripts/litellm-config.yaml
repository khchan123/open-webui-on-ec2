model_list:
  # Anthropic - Claude (JP/Global cross-region)
  # Fable 5 requires the account data-retention mode to be `provider_data_share`
  # (set per region via the Bedrock control plane). Under the default mode Bedrock
  # rejects requests with "data retention mode 'default' is not available". See README.
  - model_name: claude-fable-5
    litellm_params:
      model: bedrock/global.anthropic.claude-fable-5
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.8
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-8
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.7
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-7
      aws_region_name: ap-northeast-1

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.6
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
      aws_region_name: ap-northeast-1

  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-5
      aws_region_name: ap-northeast-1

  - model_name: claude-sonnet-4.5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.5
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-5-20251101-v1:0
      aws_region_name: ap-northeast-1

  - model_name: claude-haiku-4.5
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: ap-northeast-1

# Amazon - Nova (JP cross-region / Tokyo direct)
  - model_name: nova-2-lite
    litellm_params:
      model: bedrock/jp.amazon.nova-2-lite-v1:0
      aws_region_name: ap-northeast-1

  - model_name: nova-2-sonic
    litellm_params:
      model: bedrock/amazon.nova-2-sonic-v1:0
      aws_region_name: ap-northeast-1

  # OpenAI - GPT-5.6 (bedrock-mantle, us-east-1 only, Responses API)
  # These route through the bedrock-mantle endpoint, NOT the standard bedrock
  # Converse path, so they need a Bedrock API key (BEDROCK_MANTLE_API_KEY) rather
  # than the instance IAM role. GPT-5.6 is Responses-API-only; LiteLLM bridges
  # Open WebUI's /chat/completions calls onto /responses automatically.
  - model_name: gpt-5.6-sol
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-sol
      api_base: https://bedrock-mantle.us-east-1.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY

  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-terra
      api_base: https://bedrock-mantle.us-east-1.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY

  - model_name: gpt-5.6-luna
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-luna
      api_base: https://bedrock-mantle.us-east-1.api.aws/openai/v1
      api_key: os.environ/BEDROCK_MANTLE_API_KEY

  # DeepSeek (Tokyo direct)
  - model_name: deepseek-v3.2
    litellm_params:
      model: bedrock/deepseek.v3.2
      aws_region_name: ap-northeast-1

  # Moonshot AI (Tokyo direct)
  - model_name: kimi-k2.5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: ap-northeast-1

  - model_name: kimi-k2-thinking
    litellm_params:
      model: bedrock/moonshot.kimi-k2-thinking
      aws_region_name: ap-northeast-1

  # MiniMax (Tokyo direct)
  - model_name: minimax-m2.1
    litellm_params:
      model: bedrock/minimax.minimax-m2.1
      aws_region_name: ap-northeast-1

  - model_name: minimax-m2.5
    litellm_params:
      model: bedrock/converse/minimax.minimax-m2.5
      aws_region_name: us-east-1

  # Qwen (Tokyo direct)
  - model_name: qwen3-coder-480b
    litellm_params:
      model: bedrock/qwen.qwen3-coder-480b-a35b-v1:0
      aws_region_name: ap-northeast-1

  - model_name: qwen3-vl-235b
    litellm_params:
      model: bedrock/qwen.qwen3-vl-235b-a22b
      aws_region_name: ap-northeast-1

  - model_name: qwen3-next-80b
    litellm_params:
      model: bedrock/qwen.qwen3-next-80b-a3b
      aws_region_name: ap-northeast-1

  # Z.AI (Tokyo direct)
  - model_name: glm-4.7
    litellm_params:
      model: bedrock/zai.glm-4.7
      aws_region_name: ap-northeast-1

  - model_name: glm-5
    litellm_params:
      model: bedrock/converse/zai.glm-5
      aws_region_name: us-east-1

litellm_settings:
  drop_params: true
  num_retries: 2
