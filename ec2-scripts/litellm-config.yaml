model_list:
  # Anthropic - Claude 5 + Claude 4.6/4.7/4.8 (global cross-region inference
  # profiles, entered via Tokyo). Sub-4.6 lines (sonnet/opus/haiku 4.5) were
  # dropped; all model IDs below are ACTIVE in Bedrock as of this update.
  # Fable requires the account data-retention mode to be `provider_data_share`
  # (set per region via the Bedrock control plane). Under the default mode Bedrock
  # rejects requests with "data retention mode 'default' is not available". See README.
  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-5
      aws_region_name: ap-northeast-1

  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-5
      aws_region_name: ap-northeast-1

  - model_name: claude-fable-5.1
    litellm_params:
      model: bedrock/global.anthropic.claude-fable-5-1
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.8
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-8
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.7
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-7
      aws_region_name: ap-northeast-1

  - model_name: claude-opus-4.6
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
      aws_region_name: ap-northeast-1

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: ap-northeast-1

# Amazon - Nova (JP cross-region / Tokyo direct)
  - model_name: nova-2-lite
    litellm_params:
      model: bedrock/jp.amazon.nova-2-lite-v1:0
      aws_region_name: ap-northeast-1

  - model_name: nova-2-sonic
    litellm_params:
      model: bedrock/amazon.nova-2-sonic-v1:0
      aws_region_name: ap-northeast-1

  # OpenAI - GPT (global cross-region inference profile, via Tokyo). Standard
  # Bedrock Converse path with the instance IAM role - the old bedrock-mantle
  # endpoint and its API key have been removed.
  - model_name: gpt-6-astra
    litellm_params:
      model: bedrock/global.openai.gpt-6-astra
      aws_region_name: ap-northeast-1

  - model_name: gpt-5.6-sol
    litellm_params:
      model: bedrock/global.openai.gpt-5.6-sol
      aws_region_name: ap-northeast-1

  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock/global.openai.gpt-5.6-terra
      aws_region_name: ap-northeast-1

  - model_name: gpt-5.6-luna
    litellm_params:
      model: bedrock/global.openai.gpt-5.6-luna
      aws_region_name: ap-northeast-1

  # xAI - Grok (global cross-region inference profile, via Tokyo)
  - model_name: grok-4.6
    litellm_params:
      model: bedrock/global.xai.grok-4.6
      aws_region_name: ap-northeast-1

  # DeepSeek (Tokyo direct)
  - model_name: deepseek-v3.2
    litellm_params:
      model: bedrock/deepseek.v3.2
      aws_region_name: ap-northeast-1

  # Moonshot AI (Tokyo direct)
  - model_name: kimi-k2.5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: ap-northeast-1

  - model_name: kimi-k2-thinking
    litellm_params:
      model: bedrock/moonshot.kimi-k2-thinking
      aws_region_name: ap-northeast-1

  # MiniMax (Tokyo direct)
  - model_name: minimax-m2.1
    litellm_params:
      model: bedrock/minimax.minimax-m2.1
      aws_region_name: ap-northeast-1

  - model_name: minimax-m2.5
    litellm_params:
      model: bedrock/converse/minimax.minimax-m2.5
      aws_region_name: us-east-1

  # Qwen (Tokyo direct)
  - model_name: qwen3-coder-480b
    litellm_params:
      model: bedrock/qwen.qwen3-coder-480b-a35b-v1:0
      aws_region_name: ap-northeast-1

  - model_name: qwen3-vl-235b
    litellm_params:
      model: bedrock/qwen.qwen3-vl-235b-a22b
      aws_region_name: ap-northeast-1

  - model_name: qwen3-next-80b
