services:
  db:
    image: postgres:16
    container_name: litellm-db
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.100.0
    container_name: litellm
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      - DATABASE_URL=postgresql://llmproxy:${POSTGRES_PASSWORD}@db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: always
    ports:
      - "80:8080"
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=pending
    depends_on:
      litellm:
        condition: service_healthy

  # Hermes agent (gateway API on :8642, internal to the compose network only).
  # Shares the litellm proxy above via the compose network (http://litellm:4000).
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: hermes-agent
    restart: always
    command: ["gateway", "run"]
    volumes:
      # Shared config/state root (also mounted by hermes-webui). Bind-mounted so
      # start.sh can pre-seed config.yaml. Persisted on the /mnt/app data volume.
      - ./hermes-home:/home/hermes/.hermes
      # Agent source, seeded from the image; hermes-webui mounts it read-only and
      # pip-installs it at boot. Named volume lives on the root disk (re-seedable;
      # start.sh re-seeds it whenever the agent image changes).
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
    depends_on:
      litellm:
        condition: service_healthy

  # Hermes WebUI (port 8787). Runs the agent in-process for chat, reading the
  # shared config.yaml; the gateway container above is used for its Tasks/health
  # probe. Fronted by its own CloudFront distribution + WAF + password auth.
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:0.52.432
    container_name: hermes-webui
    restart: always
    ports:
      - "8787:8787"
    volumes:
      - ./hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ./hermes-workspace:/workspace
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_API_URL=http://hermes-agent:8642
      - WANTED_UID=1000
      - WANTED_GID=1000
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      # HERMES_WEBUI_PASSWORD intentionally unset: the login password is
      # managed in the WebUI (Settings) and persisted, hashed, in
      # hermes-home/webui/settings.json. Setting it here would override and
      # lock out the UI-managed password (env var wins in auth.py).
    depends_on:
      - hermes-agent

volumes:
  hermes-agent-src:
